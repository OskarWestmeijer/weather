services:
  weather-db:
    image: postgres:18.1-alpine3.21
    container_name: weather-db
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 500m
        reservations:
          memory: 500m
    expose:
      - "5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      POSTGRES_DB: weather
    healthcheck:
      # $$ keeps the expansion in the container, at runtime.
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      log_category: "infra"

  weather-api:
    image: oskarwestmeijer/weather-api:${WEATHER_IMAGE_TAG:-latest}
    depends_on:
      weather-db:
        condition: service_healthy
    container_name: weather-api
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 1500M
        reservations:
          memory: 1500M
    expose:
      - "8080"
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://weather-db:5432/weather
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      OPENWEATHERAPI_APPID: ${OPENWEATHERAPI_APPID}
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      # Actuator reports UP only once Liquibase ran and the datasource answers.
      # 127.0.0.1, not localhost: that resolves to ::1 first, where the JVM is not listening.
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    labels:
      log_category: "application"

  weather-ui:
    image: oskarwestmeijer/weather-ui:${WEATHER_IMAGE_TAG:-latest}
    depends_on:
      weather-api:
        condition: service_healthy
    container_name: weather-ui
    logging:
      driver: "json-file"
      options:
        max-size: "25m"
        max-file: "1"
    deploy:
      resources:
        limits:
          memory: 100m
        reservations:
          memory: 100m
    expose:
      - "80"
    restart: always
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      log_category: "nginx"

volumes:
  postgres_data:

networks:
  default:
    name: proxy
    external: true
